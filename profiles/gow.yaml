# God of War detection profile.
#
# God of War has no killfeed and no on-screen callout to OCR. Its cutscenes
# are the highlight-worthy content, and the signal that actually detects them
# is the DIALOGUE SUBTITLE, not letterbox bars:
#
#   - Letterbox was tried first and FAILS on real footage: God of War Ragnarök
#     renders cutscenes full-frame (cropdetect reports 3840:2160:0:0 through an
#     entire opening cutscene — no bars exist to detect). Confirmed on
#     gow_video3. The LetterboxDetector is still wired in for letterboxed
#     titles, but there's no letterbox signal declared here because it's inert
#     on this game.
#   - Every GoW cutscene/dialogue beat shows a bottom-center subtitle caption
#     ("Heimdall: ...", "Atreus: ..."). The SubtitleDetector OCRs that band
#     (with binarization) and fires on caption *presence* — it doesn't match
#     specific words. That maps "there is story dialogue on screen" to a
#     strong cutscene signal.
#
# Honest limits (see pkg/signal/subtitle.go): this also fires on walk-and-talk
# gameplay banter (Mimir/Atreus chatter), which for GoW is arguably still
# clip-worthy but isn't strictly a cutscene. It needs subtitles enabled in the
# game. The caption region + binarization threshold were tuned against the
# gow_video3 720p proxy; re-check them if your HUD/subtitle style differs.
# Still passes through the LLM judge + human review gate like every candidate.
game: gow
version: 3

signals:
  # Bottom-center dialogue caption band. Region is fractional (resolution
  # independent) and tuned on real GoW Ragnarök footage. OCR presence -> strong
  # cutscene signal.
  - name: cutscene
    kind: subtitle
    region: { x: 0.10, y: 0.70, w: 0.80, h: 0.12 }
    weight: { cutscene: 3.0 }
    decay_seconds: 6
    sample_fps: 2

archetypes:
  # Cutscenes: strong signal, low threshold. A single caption event scores
  # weight 3.0 >> threshold 1.0, so any detected dialogue run clears the bar.
  # The detector emits an event every few seconds across the run;
  # streak_merge_gap_s stitches them into one window spanning the whole scene
  # instead of many overlapping clips. max_length_s is a generous safety cap
  # (cutscenes run long) — if it clamps, the front is trimmed and the ending
  # kept (see pkg/scoring.enforceLength).
  - name: cutscene
    threshold: 1.0
    min_length_s: 10
    max_length_s: 180
    lead_pad_s: 2
    trail_pad_s: 2
    streak_merge_gap_s: 8

  - name: generic
    threshold: 0.6
    min_length_s: 15
    max_length_s: 45
    lead_pad_s: 8
    trail_pad_s: 5
