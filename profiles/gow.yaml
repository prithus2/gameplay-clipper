# God of War detection profile.
#
# God of War has no killfeed and no on-screen callout to OCR. Its cutscenes
# are the highlight-worthy content, and the signal that actually detects them
# is the DIALOGUE SUBTITLE, not letterbox bars:
#
#   - Letterbox was tried first and FAILS on real footage: God of War Ragnarök
#     renders cutscenes full-frame (cropdetect reports 3840:2160:0:0 through an
#     entire opening cutscene — no bars exist to detect). Confirmed on
#     gow_video3. The LetterboxDetector is still wired in for letterboxed
#     titles, but there's no letterbox signal declared here because it's inert
#     on this game.
#   - Every GoW cutscene/dialogue beat shows a bottom-center subtitle caption
#     ("Heimdall: ...", "Atreus: ..."). The SubtitleDetector OCRs that band
#     (with binarization) and fires on caption *presence* — it doesn't match
#     specific words. That maps "there is story dialogue on screen" to a
#     strong cutscene signal.
#
# Honest limits (see pkg/signal/subtitle.go): this also fires on walk-and-talk
# gameplay banter (Mimir/Atreus chatter), which for GoW is arguably still
# clip-worthy but isn't strictly a cutscene. It needs subtitles enabled in the
# game. The caption region + binarization threshold were tuned against the
# gow_video3 720p proxy; re-check them if your HUD/subtitle style differs.
# Still passes through the LLM judge + human review gate like every candidate.
game: gow
version: 3

signals:
  # Bottom-center dialogue caption band. Region is fractional (resolution
  # independent) and tuned on real GoW Ragnarök footage. OCR presence -> strong
  # cutscene signal.
  - name: cutscene
    kind: subtitle
    region: { x: 0.10, y: 0.70, w: 0.80, h: 0.12 }
    weight: { cutscene: 3.0 }
    decay_seconds: 6
    sample_fps: 2

reel:
  # Cutscenes default to short.mp4 (blur-pad), not reel.mp4. This is the one
  # case where preserving the frame beats filling the screen: a God of War
  # cinematic is composed for 16:9 — wide two-shots, scenery, framing that is
  # the point of the shot — and a crop keeping 31.6% of the width throws the
  # composition away rather than reframing it. Everything else in this game
  # (the generic archetype: combat, traversal) crops fine and defaults to reel.
  blurpad_archetypes: [cutscene]

  # No keep_visible entry for the subtitle caption. One used to be declared
  # here (region x:0.10 y:0.70 w:0.80 h:0.12, gated on the cutscene signal),
  # and it was the cause of a real defect: it rendered as a full-width solid
  # black bar slicing the frame in half.
  #
  # The band mechanism composites a source region into a canvas-width slot —
  # it can only make an element BIGGER, never smaller, and this caption is
  # already wider than the crop leaves room for. The region is 3072px wide
  # (0.80 of a 3840px frame) against this game's 1214px-wide reel canvas: a
  # forced 0.39x shrink. Worse, the crop that produces the ghost is 1:1
  # vertically (a 4K master's reel crop takes the full source height, no
  # scaling), so that 0.39x holds no matter how the region's height is tuned
  # — the plate is structurally ~60% black padding, not a fixable tuning
  # mistake. cutter.planBands now skips any band that would shrink its
  # element rather than magnify it (see minBandMagnification in
  # pkg/cutter/reel.go), so leaving this entry in would just be a documented
  # no-op; it's removed instead so the profile doesn't claim a guarantee the
  # renderer can't keep.
  #
  # This isn't a loss for the caption, though: cutscene is already in
  # blurpad_archetypes above, so every clip carrying this signal renders as
  # short.mp4, not reel.mp4 — the full 16:9 frame, captions included, at the
  # cost of the blur-pad borders. The generic archetype (combat, traversal)
  # has no caption to lose in the first place.

archetypes:
  # Cutscenes: strong signal, low threshold. A single caption event scores
  # weight 3.0 >> threshold 1.0, so any detected dialogue run clears the bar.
  # The detector emits an event every few seconds across the run;
  # streak_merge_gap_s stitches them into one window spanning the whole scene
  # instead of many overlapping clips. max_length_s is a generous safety cap
  # (cutscenes run long) — if it clamps, the front is trimmed and the ending
  # kept (see pkg/scoring.enforceLength).
  - name: cutscene
    threshold: 1.0
    min_length_s: 10
    max_length_s: 180
    lead_pad_s: 2
    trail_pad_s: 2
    streak_merge_gap_s: 8

  - name: generic
    threshold: 0.6
    min_length_s: 15
    max_length_s: 45
    lead_pad_s: 8
    trail_pad_s: 5
